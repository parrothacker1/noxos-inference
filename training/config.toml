[dataset]
urls = [
    "https://huggingface.co/datasets/Mouwiya/UNSW-NB15/resolve/main/data/train-00000-of-00002.parquet",
    "https://huggingface.co/datasets/Mouwiya/UNSW-NB15/resolve/main/data/train-00001-of-00002.parquet",
]
raw_dir = "data/raw"
protos = ["tcp", "udp"]

[mirage]
archive_url = "https://traffic.comics.unina.it/mirage/MIRAGE/MIRAGE-2019_traffic_dataset_downloadable_v2.tar.gz"
archive_file = "data/raw/mirage.tar.gz"
archive_sha256 = "14d8f0a86cc288492dab0ddba4178255873c3c8bba1c3440aa38a908fad60221"
dir = "data/raw/mirage/MIRAGE-2019_traffic_dataset_downloadable"
records = "data/raw/mirage_records.parquet"
test_app_fraction = 0.2
calibration_app_fraction = 0.1
threshold_percentile_tcp = 97
threshold_percentile_udp = 99
threshold_percentiles = [95, 97, 99]
app_split_repeats = 5

[utmobilenet]
enabled = false
archive_url = "https://ndownloader.figshare.com/files/42438624"
archive_sha256 = "c7452c19e1516d025a99c2fa41cdf70c6cd19c0aef80037f55cc867375e194d3"
parquet = "data/raw/utmobilenet21.parquet"
records = "data/raw/utmobilenet_records.parquet"

[features]
numeric = ["dst_port", "src_byte_count", "src_packet_count", "dst_byte_count", "duration_millis", "handshake_latency_millis", "smean"]
log = ["dst_port", "src_byte_count", "src_packet_count", "dst_byte_count", "duration_millis", "handshake_latency_millis", "smean"]
categorical = ["proto"]
transform = "sqrt"

[training]
n_splits = 5
random_state = 42
hidden_dim = 32
bottleneck_dim = 4
epochs = 60
batch_size = 512
learning_rate = 0.001
categorical_top_n = 6
threshold_percentile_min = 70
threshold_percentile_max = 99

[device_log]
def = 1
threshold_percentile = 99
holdout_fraction = 0.4
min_records = 20000
model_prefix = "models/autoencoder_device"
metrics_out = "METRICS_device.md"
anomaly_log = ""

[paths]
models_dir = "models"
model_out = "models/autoencoder.pt"
ondevice_out = "models/autoencoder_ondevice.json"
metrics_out = "METRICS.md"
