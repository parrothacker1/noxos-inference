[dataset]
raw_dir = "data"
features_url = "https://raw.githubusercontent.com/Nageshwari152/Malicious-Application-Detection-using-Machine-Learning/main/drebin-215-dataset-5560malware-9476-benign.csv"
features_file = "drebin215.csv"
features_sha256 = "710f2c11b0cad04c36f56dd16398127feb697fd99e8efa7f75890b792fba3ad5"
categories_url = "https://raw.githubusercontent.com/Nageshwari152/Malicious-Application-Detection-using-Machine-Learning/main/dataset-features-categories.csv"
categories_file = "cats.csv"
categories_sha256 = "186ff7911d80f0c7268047886e50761ef0221d028e0ed140024cd89e5e57725b"

[training]
n_splits = 5
random_state = 42
n_estimators = 300
max_depth = 6
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8
deployed_feature_set = "permissions"

[paths]
models_dir = "models"
model_out = "models/file_classifier.joblib"
ondevice_out = "models/file_classifier_ondevice.json"
metrics_out = "METRICS.md"
