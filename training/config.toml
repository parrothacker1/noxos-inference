[teacher_oof]
path = "data/teacher_oof.parquet"

[training]
n_splits = 5
random_state = 42
n_estimators = 100
max_depth = 4
learning_rate = 0.1
subsample = 0.8
colsample_bytree = 0.8

[paths]
model_out = "models/student.joblib"
ondevice_out = "models/student_ondevice.json"
metrics_out = "METRICS.md"
