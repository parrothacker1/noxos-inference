name: Train and publish autoencoder model

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: filter-autoencoder

      - uses: astral-sh/setup-uv@v5

      - working-directory: training
        run: uv sync

      - name: Manual release only
        run: |
          echo "The autoencoder is trained on MIRAGE-2019 (a 1.4 GB archive that expands to 4.8 GB) and published by hand. This workflow no longer trains it; see knowledge-graph/noxos-inference/ML-AUTOENCODER-CONTRACT.md."
          exit 1

      - name: Build release assets
        id: assets
        working-directory: training
        run: |
          VERSION=$(date +%s)
          cp models/autoencoder_ondevice.json model.json
          SHA256=$(sha256sum model.json | cut -d' ' -f1)
          echo "$SHA256  model.json" > model.json.sha256
          printf '{"version": %s, "sha256": "%s", "modelUrl": "https://github.com/%s/releases/download/autoencoder-latest/model.json"}' \
            "$VERSION" "$SHA256" "$GITHUB_REPOSITORY" > manifest.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish rolling "latest" release
        working-directory: training
        run: |
          gh release delete autoencoder-latest --yes --cleanup-tag || true
          gh release create autoencoder-latest model.json manifest.json model.json.sha256 METRICS.md \
            --title "On-device autoencoder model (latest) - INTERIM, UNSW-NB15 only" \
            --notes "INTERIM. Trained and validated only on UNSW-NB15, never on real phone traffic; feature units differ from what Warden measures on-device; overall F1 is dominated by UDP (see per-protocol table in METRICS.md); threshold changes every retrain, read it from model.json. Automated run, version ${{ steps.assets.outputs.version }}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish versioned release
        working-directory: training
        run: |
          gh release create "autoencoder-${{ steps.assets.outputs.version }}" model.json manifest.json model.json.sha256 METRICS.md \
            --title "On-device autoencoder model v${{ steps.assets.outputs.version }} - INTERIM" \
            --notes "INTERIM, UNSW-NB15 only. See METRICS.md."
        env:
          GH_TOKEN: ${{ github.token }}
