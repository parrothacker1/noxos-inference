name: Train and publish teacher model

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teacher-xgboost

      - uses: astral-sh/setup-uv@v5

      - working-directory: training
        run: uv sync

      - name: Fetch dataset
        working-directory: training
        run: |
          mkdir -p ../data/raw
          uv run python -c "import tomllib; print('\n'.join(tomllib.load(open('config.toml','rb'))['dataset']['urls']))" > /tmp/dataset_urls.txt
          while IFS= read -r URL; do
            curl -sL "$URL" -o "../data/raw/$(basename "$URL")"
          done < /tmp/dataset_urls.txt

      - name: Train teacher ensemble (OOF targets for the student)
        working-directory: training
        run: uv run train_teacher.py

      - name: Train production teacher (full-data, for teacher-server)
        working-directory: training
        run: uv run train_teacher_production.py

      - name: Export production teacher to on-device JSON
        working-directory: training
        run: uv run export_teacher_model.py

      - name: Verify export matches the trained model
        working-directory: training
        run: uv run test_export.py

      - name: Build release assets
        id: assets
        working-directory: training
        run: |
          VERSION=$(date +%s)
          cp models/teacher_ondevice.json model.json
          SHA256=$(sha256sum model.json | cut -d' ' -f1)
          echo "$SHA256  model.json" > model.json.sha256
          printf '{"version": %s, "sha256": "%s", "modelUrl": "https://github.com/%s/releases/download/teacher-latest/model.json"}' \
            "$VERSION" "$SHA256" "$GITHUB_REPOSITORY" > manifest.json
          (cd models && sha256sum oof_predictions.parquet) > oof_predictions.parquet.sha256
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish rolling "latest" release
        working-directory: training
        run: |
          gh release delete teacher-latest --yes --cleanup-tag || true
          gh release create teacher-latest \
            model.json manifest.json model.json.sha256 \
            models/oof_predictions.parquet oof_predictions.parquet.sha256 METRICS.md \
            --title "Teacher model (latest)" \
            --notes "Automated training run, version ${{ steps.assets.outputs.version }}."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish versioned release
        working-directory: training
        run: |
          gh release create "teacher-${{ steps.assets.outputs.version }}" \
            model.json manifest.json model.json.sha256 \
            models/oof_predictions.parquet oof_predictions.parquet.sha256 METRICS.md \
            --title "Teacher model v${{ steps.assets.outputs.version }}" \
            --notes "Automated training run."
        env:
          GH_TOKEN: ${{ github.token }}
